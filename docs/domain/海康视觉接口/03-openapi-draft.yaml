openapi: 3.0.3
info:
  title: 海康视觉检验数据接口
  description: |
    海康视觉中控平台 与 英科数据平台 之间的对接接口定义草稿。
    包含：
      - 海康提供：配置查询、检测数据查询
      - 英科提供：登录验证、报警数据上传（统一 dataportal/invoke 入口）
    注意：本文件基于 2024-08-30 需求文档整理，带 x-todo 标记的字段/路径为待确认项。
  version: 0.1.0
  contact:
    name: 接口对接双方

servers:
  - url: http://192.168.32.86:1025
    description: 英科测试环境
  - url: http://192.168.80.33:10031
    description: 英科正式环境
  - url: http://{hik-host}:{hik-port}
    description: 海康视觉中控平台（地址待海康提供）
    variables:
      hik-host:
        default: TODO-HIK-HOST
      hik-port:
        default: "TODO-HIK-PORT"

tags:
  - name: HikVision
    description: 海康视觉中控平台提供的接口
  - name: Yingke
    description: 英科数据平台提供的接口

paths:
  ########################################
  # 海康提供接口
  ########################################
  /api/vision/config:
    get:
      tags: [HikVision]
      summary: 接口1-视觉中控平台配置查询
      description: 查询该车间服务下所有产线组、缺陷类型组、面别组。
      operationId: getVisionConfig
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
          required: false
          description: 鉴权 Token（x-todo：海康侧鉴权方案待确认）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '400':
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-todo:
        - 完整 URL 待海康提供，当前路径 /api/vision/config 为草稿示例。

  /api/vision/detection-data:
    post:
      tags: [HikVision]
      summary: 接口2-视觉检测数据查询
      description: |
        按时间/产线/缺陷/面别查询视觉检测次品统计数据。
        time 参数传整点（YYYY-MM-DD HH:00:00）。
      operationId: queryDetectionData
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
          required: false
          description: 鉴权 Token（x-todo：鉴权方案待确认）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectionDataRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionDataResponse'
        '400':
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-todo:
        - 完整 URL 待海康提供。
        - 请求字段命名统一为 lineGroup/defectGroup/faceGroup（原 lindGroup 笔误）。
        - time 传整点的语义待确认（小时聚合 vs 时点精确查询）。

  ########################################
  # 英科提供接口（统一 dataportal/invoke 入口）
  ########################################
  /api/dataportal/invoke:
    post:
      tags: [Yingke]
      summary: 统一数据入口（登录/报警上传）
      description: |
        英科数据平台统一入口，通过 ApiType + Method 区分具体动作：
        - ApiType=AuthenticationController, Method=Login：登录
        - ApiType=VisualInspectionController, Method=HandleVisualInspectionAlarm：报警上传
      operationId: dataportalInvoke
      parameters:
        - in: header
          name: Content-Type
          schema:
            type: string
            example: application/json
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/LoginRequest'
                - $ref: '#/components/schemas/AlarmUploadRequest'
            examples:
              LoginExample:
                $ref: '#/components/examples/LoginRequestExample'
              AlarmExample:
                $ref: '#/components/examples/AlarmUploadRequestExample'
      responses:
        '200':
          description: 调用成功（业务成功/失败需看 Success 与 Result.code）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/AlarmUploadResponse'
              examples:
                LoginSuccess:
                  $ref: '#/components/examples/LoginResponseExample'
                AlarmSuccess:
                  $ref: '#/components/examples/AlarmUploadSuccessExample'
                AlarmFail:
                  $ref: '#/components/examples/AlarmUploadFailExample'

components:
  ########################
  # Schemas
  ########################
  schemas:
    # ---------- 海康接口 ----------
    ConfigResponse:
      type: object
      required: [code, results]
      properties:
        code:
          type: integer
          example: 200
          description: 状态码，200 成功 / 400 失败
        results:
          type: object
          nullable: true
          properties:
            lineGroup:
              type: array
              items:
                type: string
              example: ["line1A", "line1B", "line2A", "line2B"]
              description: 产线组
            defectGroup:
              type: array
              items:
                type: string
              example: ["底面破损", "侧面破损", "二次料"]
              description: 缺陷类型组
            faceGroup:
              type: array
              items:
                type: string
              example: ["A面", "B面"]
              description: 面别组
        message:
          type: string
          nullable: true
          description: 异常原因（失败时返回）

    DetectionDataRequest:
      type: object
      required: [time]
      properties:
        time:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2} \d{2}:00:00$'
          example: "2024-08-13 14:00:00"
          description: 日期时间（整点，YYYY-MM-DD HH:00:00）
        lineGroup:
          type: array
          items:
            type: string
          description: 产线（非必填/多选，不填默认查所有）
        defectGroup:
          type: array
          items:
            type: string
          description: 异常类型（非必填/多选，不填默认查所有）
        faceGroup:
          type: array
          items:
            type: string
          description: 面别（非必填/多选，不填默认查所有）

    DetectionDataResponse:
      type: object
      required: [code]
      properties:
        code:
          type: integer
          example: 0
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            defects:
              type: array
              items:
                $ref: '#/components/schemas/DefectStat'
            removeCounts:
              type: array
              items:
                $ref: '#/components/schemas/RemoveCount'
        message:
          type: string
          nullable: true
      x-todo:
        - 原文成功示例是 code:0 + success:true + data，失败示例是 code:400 + results:null + message，需统一结构。

    DefectStat:
      type: object
      properties:
        time:
          type: string
          format: date-time
          example: "2024-08-13 14:01:54"
        line:
          type: string
          example: "line1A"
        defect:
          type: string
          example: "底面破损"
        face:
          type: string
          example: "A面"
        detectionCount:
          type: integer
          example: 1

    RemoveCount:
      type: object
      properties:
        line:
          type: string
          example: "line1A"
        face:
          type: string
          example: "A面"
        removeCount:
          type: integer
          example: 1
      x-todo:
        - removeCounts 的业务含义待澄清（次品剔除数 vs 数据删除数）。

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          example: 400
        results:
          nullable: true
          example: null
        message:
          type: string
          example: "异常原因"

    # ---------- 英科接口：通用信封 ----------
    DataportalEnvelope:
      type: object
      required: [ApiType, Method, Parameters, Context]
      properties:
        ApiType:
          type: string
          example: AuthenticationController
        Method:
          type: string
          example: Login
        Parameters:
          type: array
          items:
            type: object
            properties:
              Value: {}
        Context:
          $ref: '#/components/schemas/RequestContext'

    RequestContext:
      type: object
      properties:
        Ticket:
          type: string
          nullable: true
          description: 登录接口返回的凭证；登录调用时为空，其他调用必传。
        InvOrgId:
          type: integer
          example: 1
      x-todo:
        - Ticket 有效期与刷新机制待确认。

    DataportalResponseEnvelope:
      type: object
      required: [Success, Context]
      properties:
        Success:
          type: boolean
          example: true
          description: 外层调用是否成功（注意：业务失败时 Success 也可能为 true，需看 Result.code）。
        Message:
          type: string
          nullable: true
        Result:
          type: object
          nullable: true
          additionalProperties: true
        Context:
          $ref: '#/components/schemas/ResponseContext'

    ResponseContext:
      type: object
      properties:
        Ticket:
          type: string
        InvOrgId:
          type: integer
          example: 1

    # ---------- 英科接口：登录 ----------
    LoginRequest:
      allOf:
        - $ref: '#/components/schemas/DataportalEnvelope'
        - type: object
          properties:
            ApiType:
              type: string
              example: AuthenticationController
            Method:
              type: string
              example: Login
            Parameters:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: object
                properties:
                  Value:
                    type: string
              example:
                - { Value: "HKSJSB" }
                - { Value: "HKSJSB123" }
              description: 第1位账号，第2位密码。
            Context:
              type: object
              example: {}

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/DataportalEnvelope'
        - type: object
          properties:
            Result:
              type: object
              properties:
                UserId:
                  type: number
                  example: 50001.0
                EmployeeId:
                  type: number
                  example: 60002.0
                UserCode:
                  type: string
                  example: HKSJSB
                UserName:
                  type: string
                  example: "海康视觉设备[HKSJSB]"
                InvOrg:
                  type: integer
                  example: 1

    # ---------- 英科接口：报警上传 ----------
    AlarmUploadRequest:
      allOf:
        - $ref: '#/components/schemas/DataportalEnvelope'
        - type: object
          properties:
            ApiType:
              type: string
              example: VisualInspectionController
            Method:
              type: string
              example: HandleVisualInspectionAlarm
            Parameters:
              type: array
              minItems: 1
              items:
                type: object
                properties:
                  Value:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlarmItem'
            Context:
              $ref: '#/components/schemas/RequestContext'

    AlarmItem:
      type: object
      required:
        - WorkShop
        - Line
        - Face
        - AlarmTime
        - AlarmType
        - AlarmLevel
        - AlarmDetails
        - AlarmResult
        - AlarmCount
      properties:
        WorkShop:
          type: string
          description: 车间代码，见 WorkShopEnum
          example: HBN1
        Line:
          type: string
          example: "Line A"
        Face:
          type: string
          example: Front
        AlarmTime:
          type: string
          format: date-time
          example: "2024-08-30T14:30:00"
          description: 报警时间（建议 ISO 8601；x-todo：与海康侧时间格式统一）
        AlarmType:
          type: string
          example: "Temperature Alert"
          description: 报警类型（x-todo：枚举待海康提供）
        AlarmLevel:
          type: string
          example: High
          description: 报警等级（x-todo：枚举待海康提供）
        AlarmDetails:
          type: string
          example: "Temperature exceeded threshold"
        AlarmResult:
          type: string
          example: "已处理"
          description: 处理结果，未处理/已处理/误报 等（x-todo：枚举待确认）
        AlarmCount:
          type: number
          example: 1

    AlarmUploadResponse:
      allOf:
        - $ref: '#/components/schemas/DataportalEnvelope'
        - type: object
          properties:
            Result:
              type: object
              required: [code]
              properties:
                code:
                  type: integer
                  description: 业务状态码，200 成功 / 400 失败
                  example: 200
                message:
                  type: string
                  nullable: true
                  example: null

    # ---------- 枚举 ----------
    WorkShopEnum:
      type: string
      description: 车间代码枚举
      enum:
        - HBN1 - HBN6
        - HBP1 - HBP6
        - JXN1 - JXN4
        - QZM1
        - QZN1 - QZN3
        - QZP1 - QZP3
      x-enum-values:
        HBN1: 淮北丁腈一车间
        HBN2: 淮北丁腈二车间
        HBN3: 淮北丁腈三车间
        HBN4: 淮北丁腈四车间
        HBN5: 淮北丁腈五车间
        HBN6: 淮北丁腈六车间
        HBP1: 淮北PVC一车间
        HBP2: 淮北PVC二车间
        HBP3: 淮北PVC三车间
        HBP4: 淮北PVC四车间
        HBP5: 淮北PVC五车间
        HBP6: 淮北PVC六车间
        JXN1: 江西丁腈一车间
        JXN2: 江西丁腈二车间
        JXN3: 江西丁腈三车间
        JXN4: 江西丁腈四车间
        QZM1: 青州口罩车间
        QZN1: 青州丁腈一车间
        QZN2: 青州丁腈二车间
        QZN3: 青州丁腈三车间
        QZP1: 青州PVC一车间
        QZP2: 青州PVC二车间
        QZP3: 青州PVC三车间

  ########################
  # Examples
  ########################
  examples:
    LoginRequestExample:
      summary: 登录请求示例
      value:
        ApiType: AuthenticationController
        Method: Login
        Parameters:
          - { Value: "HKSJSB" }
          - { Value: "HKSJSB123" }
        Context: {}

    LoginResponseExample:
      summary: 登录成功响应示例
      value:
        Success: true
        Message: null
        Result:
          UserId: 50001.0
          EmployeeId: 60002.0
          UserCode: HKSJSB
          UserName: "海康视觉设备[HKSJSB]"
          InvOrg: 1
        Context:
          Ticket: "7bJQZV6mCvdNBAGqv37bzpK3d5S2s9dfx5XClK4fdYdPXrPssMuSV1bapcvDvw7F6malRs+pwfQfA1Te/EWmTw=="
          InvOrgId: 1

    AlarmUploadRequestExample:
      summary: 报警上传请求示例
      value:
        ApiType: VisualInspectionController
        Method: HandleVisualInspectionAlarm
        Parameters:
          - Value:
              - WorkShop: TEST
                Line: "Line A"
                Face: Front
                AlarmTime: "2024-08-30T14:30:00"
                AlarmType: "Temperature Alert"
                AlarmLevel: High
                AlarmDetails: "Temperature exceeded threshold"
                AlarmResult: "已处理"
                AlarmCount: 1
        Context:
          Ticket: "7bJQZV6mCvdNBAGqv37bzpK3d5S2s9dfx5XClK4fdYdPXrPssMuSV1bapcvDvw7F6malRs+pwfQfA1Te/EWmTw=="
          InvOrgId: 1

    AlarmUploadSuccessExample:
      summary: 报警上传成功响应
      value:
        Success: true
        Message: null
        Result:
          code: 200
          message: null
        Context:
          Ticket: "tvWCOruuBALZB5wREyLp0qe29+Xo+XX5Si6VvYwambmAuaykrHO/D6Dd30Nqgi6r9n4ZONPDorwMs/L4AvyDiA=="
          InvOrgId: 1

    AlarmUploadFailExample:
      summary: 报警上传失败响应
      value:
        Success: true
        Message: null
        Result:
          code: 400
          message: "处理报警时出错: Object reference not set to an instance of an object."
        Context:
          Ticket: "H4ioiq+mRqYrVdgLUKlpA4DIKvXv8IWYVeIfAF/JTyc4IicLA99k8Ery8HrNKxMBEpINAB/AYEQXasWdXgxXmA=="
          InvOrgId: 1
