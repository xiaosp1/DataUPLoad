[tool.poetry]
name = "hk-vision-integration"
version = "0.1.0"
description = "海康视觉中控平台与英科 dataportal 对接服务"
authors = ["Integration Team <integrator@example.com>"]
readme = "README.md"
packages = [{ include = "hk_integration", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
httpx = "^0.27.0"
apscheduler = "^3.10.4"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
loguru = "^0.7.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
httpx = { extras = ["http2"], version = "^0.27.0" }

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
