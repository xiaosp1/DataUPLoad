server:
  port: 80
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  profiles:
    active: prod
  application:
    name: DataupLoad
  # W-PERF-E：HTTP UTF-8 编码修复（中文乱码）
  # StringHttpMessageConverter / 资源文件读取强制 UTF-8，
  # 与 server.servlet.encoding 互为兜底。
  http:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

logging:
  level:
    root: INFO
    com.hikrobotics: INFO

# Hik 日志路径（W-B03 启动 PSM 同款 logback-spring.xml 必需参数）
hik:
  log:
    root-path: ./log
    max-history: 30
    max-file-size: 50MB
    total-size-cap: 10GB
