<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英科手套检测中控平台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; font-family: "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; }
    body {
      background: linear-gradient(135deg, #0b457f 0%, #021f3b 100%);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .login-card {
      width: 380px; padding: 40px 36px 32px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px; box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
    }
    h1 { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 28px; letter-spacing: 1px; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 13px; color: #c9d6e8; margin-bottom: 6px; }
    .field input {
      width: 100%; height: 40px; padding: 0 12px; font-size: 14px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
      color: #fff; border-radius: 3px; outline: none;
    }
    .field input:focus { border-color: #5c88b4; background: rgba(255,255,255,0.12); }
    .btn {
      width: 100%; height: 42px; margin-top: 8px; font-size: 15px; font-weight: 600;
      color: #fff; background: #0b457f; border: none; border-radius: 3px; cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover:not(:disabled) { background: #2063a7; }
    .btn:disabled { background: #436485; cursor: not-allowed; }
    .msg { min-height: 22px; margin-top: 14px; font-size: 13px; text-align: center; }
    .msg.error { color: #ff8b8b; }
    .msg.ok { color: #8be58b; }
    .lang { position: absolute; top: 16px; right: 16px; font-size: 12px; color: #c9d6e8; }
    .lang a { color: #c9d6e8; text-decoration: none; margin: 0 4px; cursor: pointer; }
    .lang a:hover { color: #fff; }
    .hint { margin-top: 12px; font-size: 12px; color: #8aa0bd; text-align: center; }
  </style>
</head>
<body>
  <div class="lang">
    <a onclick="setLang('zh-CN')">中文</a> |
    <a onclick="setLang('en-US')">EN</a> |
    <a onclick="setLang('id-ID')">ID</a>
  </div>

  <div class="login-card">
    <h1>英科手套检测中控平台</h1>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="username">用户名 / Username</label>
        <input id="username" name="username" type="text" value="super_admin" required />
      </div>
      <div class="field">
        <label for="password">密码 / Password</label>
        <input id="password" name="password" type="password" value="Abc12345" required />
      </div>
      <button id="submitBtn" class="btn" type="submit">登录 / Login</button>
      <div id="msg" class="msg"></div>
      <div class="hint">默认密码请尽快修改 / Change default password ASAP</div>
    </form>
  </div>

  <script src="./login.js"></script>
</body>
</html>
