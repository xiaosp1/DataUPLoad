<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英科手套检测中控平台</title>
  <style>
    body.login-stage { margin:0; padding:0; height:100%; width:100%; font-family: "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0b457f 0%, #021f3b 100%); display:flex; align-items:center; justify-content:center; color:#fff; overflow:hidden; }
    .login-card { width:380px; padding:40px 36px 32px; background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:6px; box-shadow:0 12px 40px rgba(0,0,0,0.4); backdrop-filter:blur(4px); }
    h1 { font-size:20px; font-weight:700; text-align:center; margin-bottom:28px; letter-spacing:1px; }
    .field { margin-bottom:18px; }
    .field label { display:block; font-size:13px; color:#c9d6e8; margin-bottom:6px; }
    .field input { width:100%; height:40px; padding:0 12px; font-size:14px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff; border-radius:3px; outline:none; box-sizing:border-box; }
    .field input:focus { border-color:#5c88b4; background:rgba(255,255,255,0.12); }
    .btn { width:100%; height:42px; margin-top:8px; font-size:15px; font-weight:600; color:#fff; background:#0b457f; border:none; border-radius:3px; cursor:pointer; transition:background 0.15s; }
    .btn:hover:not(:disabled) { background:#2063a7; }
    .btn:disabled { background:#436485; cursor:not-allowed; }
    .msg { min-height:22px; margin-top:14px; font-size:13px; text-align:center; word-break:break-all; }
    .msg.error { color:#ff8b8b; }
    .msg.ok { color:#8be58b; }
    .lang { position:absolute; top:16px; right:16px; font-size:12px; color:#c9d6e8; }
    .lang a { color:#c9d6e8; text-decoration:none; margin:0 4px; cursor:pointer; }
    .lang a:hover { color:#fff; }
    .hint { margin-top:12px; font-size:12px; color:#8aa0bd; text-align:center; }
    body.main-stage { margin:0; padding:0; height:100%; width:100%; overflow:hidden; }
    .boot-msg { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#0b457f; color:#fff; font-size:14px; z-index:9999; transition:opacity 0.3s; }
    #dbg { position:fixed; left:0; right:0; bottom:0; max-height:40vh; overflow:auto; background:rgba(0,0,0,0.85); color:#0f0; font:12px/1.4 monospace; padding:8px; z-index:99999; white-space:pre-wrap; word-break:break-all; display:none; }
    #dbg.show { display:block; }
    #dbg.err { color:#ff8b8b; }
  </style>
</head>
<body class="login-stage">
  <div class="lang">
    <a onclick="setLang('zh-CN')">中文</a> |
    <a onclick="setLang('en-US')">EN</a> |
    <a onclick="setLang('id-ID')">ID</a>
  </div>

  <div id="loginCard" class="login-card">
    <h1>英科手套检测中控平台</h1>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="username">用户名 / Username</label>
        <input id="username" name="username" type="text" value="super_admin" required />
      </div>
      <div class="field">
        <label for="password">密码 / Password</label>
        <input id="password" name="password" type="password" value="Abc12345" required />
      </div>
      <button id="submitBtn" class="btn" type="submit">登录 / Login</button>
      <div id="msg" class="msg"></div>
      <div class="hint">默认密码请尽快修改 / Change default password ASAP</div>
    </form>
  </div>

  <pre id="dbg"></pre>

  <script>
    var DBG = [];
    function dbg(msg, isErr) {
      var el = document.getElementById("dbg");
      if (!el) return;
      DBG.push((isErr ? "[ERR] " : "[INF] ") + msg);
      if (DBG.length > 30) DBG.shift();
      el.textContent = DBG.join("\n");
      el.classList.add("show");
      if (isErr) el.classList.add("err");
      try { console.log(msg); } catch (e) {}
    }
    window.addEventListener("error", function(ev) { dbg("window.error: " + (ev.message || ev), true); });
    window.addEventListener("unhandledrejection", function(ev) { dbg("unhandledrejection: " + (ev.reason && ev.reason.message ? ev.reason.message : ev.reason), true); });

    dbg("gate v2 loaded, " + navigator.userAgent);
  </script>

  <script>
    function setLang(lang) { try { localStorage.setItem("lang", lang); } catch (e) {} }

    async function sha256Hex(text) {
      dbg("sha256 input len=" + text.length);
      var buf = new TextEncoder().encode(text);
      var hash = await crypto.subtle.digest("SHA-256", buf);
      var hex = Array.prototype.map.call(new Uint8Array(hash), function(b){return b.toString(16).padStart(2,"0")}).join("");
      dbg("sha256 done: " + hex.substring(0, 8) + "...");
      return hex;
    }

    function setMsg(text, kind) {
      var el = document.getElementById("msg");
      if (el) { el.textContent = text || ""; el.className = "msg" + (kind ? " " + kind : ""); }
    }

    function setBusy(busy) {
      var btn = document.getElementById("submitBtn");
      if (btn) { btn.disabled = busy; btn.textContent = busy ? "登录中..." : "登录 / Login"; }
    }

    async function checkLoggedIn() {
      try {
        dbg("checkLoggedIn -> /web/account/current");
        var r = await fetch("/web/account/current", { credentials: "same-origin" });
        dbg("checkLoggedIn resp: " + r.status);
        var j = await r.json();
        return j && j.success && j.data;
      } catch (e) { dbg("checkLoggedIn err: " + e.message, true); return false; }
    }

    function getCookie(name) {
      var m = document.cookie.match(new RegExp("(?:^|;\\s*)" + name + "=([^;]+)"));
      return m ? decodeURIComponent(m[1]) : null;
    }

    function syncTokenToLocalStorage() {
      // PSM 老 SPA 的 router 守卫用 js-cookie 读 document.cookie 里名为 "token" 的 cookie
      // 后端 sa-token 框架设的 cookie 叫 "satoken"，不设 "token"，所以要手动同步
      var satoken = getCookie("satoken");
      if (satoken) {
        try {
          // 设 cookie token（router 守卫要读）
          document.cookie = "token=" + encodeURIComponent(satoken) + "; path=/; max-age=2592000; SameSite=Lax";
          dbg("synced satoken -> cookie token: " + satoken.substring(0, 8) + "...");
        } catch (e) { dbg("cookie set err: " + e.message, true); }
        // 顺便也写 localStorage/sessionStorage 作为备份
        try { localStorage.setItem("token", satoken); } catch (e) {}
        try { localStorage.setItem("satoken", satoken); } catch (e) {}
        try { sessionStorage.setItem("token", satoken); } catch (e) {}
      } else {
        dbg("no satoken cookie to sync", true);
      }
    }

    async function doLogin(username, password) {
      dbg("doLogin start u=" + username);
      var pwdHash = await sha256Hex(password);
      var r = await fetch("/web/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept-Language": (function(){try{return localStorage.getItem("lang")||"zh-CN";}catch(e){return "zh-CN";}})() },
        body: JSON.stringify({ username: username, password: pwdHash }),
        credentials: "same-origin"
      });
      dbg("doLogin POST resp: " + r.status);
      var txt = await r.text();
      dbg("doLogin body: " + txt.substring(0, 120));
      var j; try { j = JSON.parse(txt); } catch (e) { j = null; }
      if (!r.ok) throw new Error((j && j.message) || ("HTTP " + r.status));
      if (j && j.success === false) throw new Error(j.message || "登录失败");
      return j;
    }

    function bootMainStage() {
      try {
        dbg("bootMainStage start");
        document.body.classList.remove("login-stage");
        document.body.classList.add("main-stage");
        document.body.innerHTML = '<div id="bootMsg" class="boot-msg">正在加载主界面...</div><div id="app"></div>';

        var links = [
          '<link rel="icon" type="image/svg+xml" href="./js/AI.png" />',
          '<link rel="stylesheet" href="./assets/vendor-6d15dd8f.css">',
          '<link rel="stylesheet" href="./assets/index-ff4f195f.css">'
        ];
        links.forEach(function(h) { document.head.insertAdjacentHTML("beforeend", h); });

        var browserJs = document.createElement("script");
        browserJs.src = "./js/browser.js";
        browserJs.onerror = function() { dbg("browser.js onerror", true); };
        browserJs.onload = function() {
          dbg("browser.js loaded");
          try {
            if (!localStorage.getItem('lang')) {
              var sz = (navigator.language || navigator.browserLanguage || 'zh-CN').toLowerCase().substring(0, 2);
              localStorage.setItem('lang', sz === 'zh' ? 'zh-CN' : (sz === 'id' ? 'id-ID' : 'en-US'));
            }
          } catch (e) {}

          var s = document.createElement("script");
          s.type = "module"; s.crossOrigin = "";
          s.src = "./js/index.f19ecd42-20260520160358.js";
          s.onerror = function() { dbg("modern chunk onerror", true); };
          document.body.appendChild(s);
          dbg("modern chunk tag appended");

          var poly = document.createElement("script");
          poly.nomodule = true; poly.crossOrigin = "";
          poly.id = "vite-legacy-polyfill";
          poly.src = "./js/polyfills-legacy.9c2b54b2-20260520160358.js";
          document.body.appendChild(poly);

          var entry = document.createElement("script");
          entry.nomodule = true;
          entry.id = "vite-legacy-entry";
          entry.setAttribute("data-src", "./js/index-legacy.0208e821-20260520160358.js");
          entry.textContent = 'System.import(document.getElementById(\'vite-legacy-entry\').getAttribute(\'data-src\'))';
          document.body.appendChild(entry);
          dbg("all scripts appended");

          setTimeout(function() {
            var m = document.getElementById("bootMsg");
            if (m) { m.style.opacity = "0"; setTimeout(function(){ if (m && m.parentNode) m.parentNode.removeChild(m); }, 350); }
          }, 800);
        };
        document.body.appendChild(browserJs);
        dbg("browser.js tag appended");
      } catch (e) {
        dbg("bootMainStage err: " + e.message + " @ " + e.stack, true);
      }
    }

    (function() {
      var f = document.getElementById("loginForm");
      if (!f) { dbg("loginForm not found", true); return; }
      f.addEventListener("submit", async function(ev) {
        ev.preventDefault();
        setMsg("", ""); setBusy(true);
        dbg("submit clicked");
        try {
          var u = document.getElementById("username").value.trim();
          var p = document.getElementById("password").value;
          if (!u || !p) { setMsg("请输入用户名和密码", "error"); setBusy(false); return; }
          await doLogin(u, p);
          dbg("doLogin ok, checking session");
          syncTokenToLocalStorage();
          var me = await checkLoggedIn();
          if (!me) throw new Error("登录校验失败 / session check failed");
          dbg("logged in as " + (me.username || me.role || "?"));
          setMsg("登录成功，正在加载主界面...", "ok");
          setTimeout(bootMainStage, 400);
        } catch (err) {
          dbg("submit err: " + (err && err.message ? err.message : err), true);
          setMsg("登录失败: " + (err && err.message ? err.message : err), "error");
          setBusy(false);
        }
      });
      dbg("submit listener attached");
    })();
  </script>
</body>
</html>
